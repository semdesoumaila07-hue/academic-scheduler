<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>

  <!-- Subtle decorative shapes -->
  <g opacity="0.18" fill="#b7d7f8">
    <circle cx="150" cy="120" r="120"/>
    <rect x="900" y="60" width="360" height="220" rx="18"/>
    <ellipse cx="600" cy="700" rx="420" ry="80"/>
  </g>

  <!-- Simple calendar/book icons (abstract) -->
  <g transform="translate(80,420) scale(0.9)" opacity="0.12">
    <rect x="0" y="0" width="220" height="160" rx="10" fill="#4b9fea"/>
    <rect x="12" y="20" width="196" height="110" rx="6" fill="#ffffff" opacity="0.9"/>
    <rect x="18" y="6" width="20" height="22" rx="4" fill="#ffffff"/>
    <rect x="48" y="6" width="20" height="22" rx="4" fill="#ffffff"/>
    <line x1="28" y1="56" x2="188" y2="56" stroke="#e6f3ff" stroke-width="8" stroke-linecap="round"/>
    <line x1="28" y1="88" x2="188" y2="88" stroke="#e6f3ff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(760,320) scale(1.05)" opacity="0.09">
    <rect x="0" y="0" width="320" height="220" rx="12" fill="#7cc0ff"/>
    <path d="M20 36h280v6H20zM20 80h280v6H20zM20 124h140v6H20z" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Soft overlay for contrast -->
  <rect width="1200" height="800" fill="#ffffff" opacity="0.02"/>
</svg>
