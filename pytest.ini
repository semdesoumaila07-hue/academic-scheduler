[pytest]
# Configuration pytest pour le projet

# Répertoires de test
testpaths = tests

# Options par défaut
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Affichage
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    slow: Tests lents
    pfair: Tests de l'algorithme Pfair
    database: Tests nécessitant la base de données

# Couverture de code (si pytest-cov installé)
# --cov=src
# --cov-report=html
# --cov-report=term-missing